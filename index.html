<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Grabador de Nodos GPS</title>
  <style>
    :root{
      --bg:#07111f;
      --panel:#0f1b2d;
      --panel2:#14243a;
      --text:#f3f6fb;
      --muted:#9fb0c6;
      --accent:#4aa3ff;
      --good:#35d07f;
      --danger:#ff5e6c;
      --border:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#07111f,#0b1626);
      color:var(--text);
      min-height:100vh;
    }
    .app{max-width:760px;margin:auto;padding:18px}
    .header{
      display:flex;justify-content:space-between;align-items:center;gap:14px;
      margin-bottom:18px
    }
    h1{font-size:1.35rem;margin:0}
    .badge{
      font-size:.8rem;color:var(--muted);
      background:var(--panel);border:1px solid var(--border);
      padding:7px 10px;border-radius:999px
    }
    .card{
      background:rgba(15,27,45,.94);
      border:1px solid var(--border);
      border-radius:20px;
      padding:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.24);
      margin-bottom:14px;
    }
    .status{
      display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px
    }
    .metric{
      background:var(--panel2);
      border:1px solid var(--border);
      border-radius:14px;padding:12px
    }
    .metric small{display:block;color:var(--muted);margin-bottom:4px}
    .metric strong{font-size:1rem;word-break:break-all}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    button{
      border:0;border-radius:14px;padding:14px 16px;font-size:1rem;
      font-weight:700;cursor:pointer;transition:.16s transform,.16s opacity
    }
    button:active{transform:scale(.98)}
    button:disabled{opacity:.5;cursor:not-allowed}
    .primary{background:var(--accent);color:white}
    .secondary{background:#223653;color:white;border:1px solid var(--border)}
    .danger{background:rgba(255,94,108,.14);color:#ff98a2;border:1px solid rgba(255,94,108,.25)}
    .full{grid-column:1/-1}
    .live{
      display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;margin-top:12px
    }
    .dot{width:9px;height:9px;border-radius:50%;background:#67778d}
    .dot.ok{background:var(--good);box-shadow:0 0 0 5px rgba(53,208,127,.11)}
    .list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .list-head h2{font-size:1rem;margin:0}
    .node{
      border:1px solid var(--border);
      background:var(--panel2);
      border-radius:15px;padding:13px;margin-top:10px
    }
    .node-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .node-title{font-weight:800}
    .node-time{font-size:.78rem;color:var(--muted)}
    .coords{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem;margin-top:8px;line-height:1.55}
    .node-actions{display:flex;gap:8px;margin-top:10px}
    .node-actions button{padding:8px 10px;font-size:.82rem;border-radius:10px}
    .empty{color:var(--muted);text-align:center;padding:24px 8px}
    .notice{
      color:var(--muted);font-size:.82rem;line-height:1.45;margin-top:10px
    }
    @media (max-width:520px){
      .status,.actions{grid-template-columns:1fr}
      .full{grid-column:auto}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Grabador de Nodos GPS</h1>
    <div class="badge"><span id="count">0</span> nodos</div>
  </div>

  <section class="card">
    <div><strong>Ubicación actual</strong></div>

    <div class="status">
      <div class="metric">
        <small>Latitud</small>
        <strong id="lat">—</strong>
      </div>
      <div class="metric">
        <small>Longitud</small>
        <strong id="lng">—</strong>
      </div>
      <div class="metric">
        <small>Precisión GPS</small>
        <strong id="acc">—</strong>
      </div>
      <div class="metric">
        <small>Última lectura</small>
        <strong id="time">—</strong>
      </div>
    </div>

    <div class="live">
      <span class="dot" id="dot"></span>
      <span id="status">Esperando ubicación…</span>
    </div>

    <div class="actions">
      <button class="secondary" id="locateBtn">Actualizar ubicación</button>
      <button class="primary" id="addBtn" disabled>+ Agregar nodo</button>
      <button class="secondary" id="jsonBtn">Exportar JSON</button>
      <button class="secondary" id="csvBtn">Exportar CSV</button>
      <button class="danger full" id="clearBtn">Borrar todos los nodos</button>
    </div>

    <div class="notice">
      La geolocalización funciona en <strong>HTTPS</strong> o en <strong>localhost</strong>.
      La precisión depende del GPS y de las condiciones del dispositivo.
    </div>
  </section>

  <section class="card">
    <div class="list-head">
      <h2>Nodos guardados</h2>
      <span class="badge" id="accuracyHint">sin lectura</span>
    </div>
    <div id="nodes"></div>
  </section>
</div>

<script>
const STORAGE_KEY = "gps_route_nodes_v1";

let currentPosition = null;
let nodes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

const $ = (id) => document.getElementById(id);

function saveNodes(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(nodes));
  renderNodes();
}

function fmt(n, digits=7){
  return Number(n).toFixed(digits);
}

function renderNodes(){
  $("count").textContent = nodes.length;
  const container = $("nodes");
  container.innerHTML = "";

  if(!nodes.length){
    container.innerHTML = '<div class="empty">Aún no hay nodos guardados.</div>';
    return;
  }

  [...nodes].reverse().forEach((node) => {
    const realIndex = nodes.findIndex(n => n.id === node.id);
    const el = document.createElement("div");
    el.className = "node";
    el.innerHTML = `
      <div class="node-top">
        <div>
          <div class="node-title">Nodo ${realIndex + 1}</div>
          <div class="node-time">${new Date(node.timestamp).toLocaleString()}</div>
        </div>
        <div class="badge">±${Math.round(node.accuracy)} m</div>
      </div>
      <div class="coords">
        lat: ${fmt(node.latitude)}<br>
        lng: ${fmt(node.longitude)}
      </div>
      <div class="node-actions">
        <button class="secondary" data-copy="${node.id}">Copiar</button>
        <button class="danger" data-delete="${node.id}">Eliminar</button>
      </div>
    `;
    container.appendChild(el);
  });

  container.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.delete;
      nodes = nodes.filter(n => String(n.id) !== String(id));
      saveNodes();
    });
  });

  container.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const node = nodes.find(n => String(n.id) === String(btn.dataset.copy));
      if(!node) return;
      const text = `${node.latitude}, ${node.longitude}`;
      await navigator.clipboard.writeText(text);
      const old = btn.textContent;
      btn.textContent = "Copiado";
      setTimeout(() => btn.textContent = old, 900);
    });
  });
}

function updateCurrent(pos){
  const c = pos.coords;
  currentPosition = {
    latitude: c.latitude,
    longitude: c.longitude,
    accuracy: c.accuracy,
    altitude: c.altitude,
    heading: c.heading,
    speed: c.speed,
    timestamp: pos.timestamp
  };

  $("lat").textContent = fmt(c.latitude);
  $("lng").textContent = fmt(c.longitude);
  $("acc").textContent = `±${Math.round(c.accuracy)} m`;
  $("time").textContent = new Date(pos.timestamp).toLocaleTimeString();
  $("status").textContent = "Ubicación disponible";
  $("dot").classList.add("ok");
  $("addBtn").disabled = false;

  let hint = "precisión media";
  if(c.accuracy <= 5) hint = "muy buena";
  else if(c.accuracy <= 10) hint = "buena";
  else if(c.accuracy > 25) hint = "baja";
  $("accuracyHint").textContent = hint;
}

function onLocationError(err){
  currentPosition = null;
  $("addBtn").disabled = true;
  $("dot").classList.remove("ok");

  const messages = {
    1: "Permiso de ubicación denegado.",
    2: "No se pudo determinar la ubicación.",
    3: "La solicitud de ubicación tardó demasiado."
  };
  $("status").textContent = messages[err.code] || "Error obteniendo la ubicación.";
}

function locate(){
  if(!navigator.geolocation){
    $("status").textContent = "Este navegador no soporta geolocalización.";
    return;
  }

  $("status").textContent = "Obteniendo ubicación…";
  navigator.geolocation.getCurrentPosition(
    updateCurrent,
    onLocationError,
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

function addNode(){
  if(!currentPosition) return;

  const node = {
    id: (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString()),
    order: nodes.length + 1,
    ...currentPosition,
    savedAt: new Date().toISOString()
  };

  nodes.push(node);
  saveNodes();

  $("status").textContent = `Nodo ${nodes.length} guardado`;
}

function downloadFile(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function exportJSON(){
  downloadFile(
    "nodos-ruta.json",
    JSON.stringify(nodes, null, 2),
    "application/json"
  );
}

function exportCSV(){
  const header = [
    "nodo","latitud","longitud","precision_m","altitud","heading","speed","timestamp","savedAt"
  ];
  const rows = nodes.map((n,i) => [
    i+1,
    n.latitude,
    n.longitude,
    n.accuracy ?? "",
    n.altitude ?? "",
    n.heading ?? "",
    n.speed ?? "",
    new Date(n.timestamp).toISOString(),
    n.savedAt
  ]);
  const csv = [header, ...rows]
    .map(row => row.map(v => `"${String(v).replaceAll('"','""')}"`).join(","))
    .join("\n");

  downloadFile("nodos-ruta.csv", csv, "text/csv;charset=utf-8");
}

$("locateBtn").addEventListener("click", locate);
$("addBtn").addEventListener("click", addNode);
$("jsonBtn").addEventListener("click", exportJSON);
$("csvBtn").addEventListener("click", exportCSV);
$("clearBtn").addEventListener("click", () => {
  if(confirm("¿Borrar todos los nodos guardados?")){
    nodes = [];
    saveNodes();
  }
});

renderNodes();
locate();
</script>
</body>
</html>
